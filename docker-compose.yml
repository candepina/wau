version: '3.8'
services:
  postgres-db:
    image: postgres:16-alpine
    container_name: wau-postgres
    environment:
      POSTGRES_DB: wau_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata_wau:/var/lib/postgresql/data
volumes:
  pgdata_wau:
