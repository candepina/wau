services:
  postgres:
    image: postgres:16-alpine
    container_name: wau-postgres
    restart: always
    environment:
      POSTGRES_DB: wau_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - wau_postgres_data:/var/lib/postgresql/data

volumes:
  wau_postgres_data: