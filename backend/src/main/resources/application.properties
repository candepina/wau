spring.application.name=backend
# Configuracion del servidor
server.port=8080

# Conexion a la base de datos de Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/wau_db
spring.datasource.username=postgres
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate (creara y actualizara las tablas automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evolution API (WhatsApp). La apikey debe coincidir con AUTHENTICATION_API_KEY en docker-compose.yml
evolution.enabled=true
evolution.base-url=http://localhost:8082
evolution.instance=wau-guarderia
evolution.apikey=wau-evolution-8f4c2a91