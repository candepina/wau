<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wau Staff - Actualizaciones</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/guarderia/timeline.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

<div class="app-container">

    <!-- Top Bar -->
    <header class="top-bar-form">
        <a href="home.html" class="btn-back" aria-label="Volver">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="logo-small">
            <i class="fa-solid fa-paw"></i>
            <span>Wau Staff</span>
        </div>
        <!--
        <a id="btnNuevaActividadHeader" href="#" class="btn-icon" aria-label="Nueva actividad" title="Nueva actividad">
            <i class="fa-solid fa-plus"></i>
        </a>-->
    </header>

    <main class="main-content">
        <!-- Header del Timeline -->
        <section class="timeline-header">
            <div class="timeline-header-info">
                <h1 class="timeline-title">Actualizaciones</h1>
            </div>
        </section>

        <!-- Lista de actividades (Timeline vertical) -->
        <section class="timeline-container" id="timelineContainer">
            <!-- Empty state -->
            <div class="empty-timeline" id="emptyTimeline" style="display: none;">
                <div class="empty-icon-wrapper">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </div>
                <h3>No hay actividades registradas</h3>
                <p>No hay registros de actividades todavía para esta mascota.</p>
                <a cla id="btnPrimeraActividad" href="#" class="btn btn-primary ">
                    <i class="fa-solid fa-plus "></i> Añadir primera actividad
                </a>
            </div>

            <!-- Timeline con actividades -->
            <div class="timeline-list" id="timelineList" style="display: none;"></div>
        </section>
    </main>

    <!-- FAB flotante para añadir actividad -->
    <a id="fabNuevaActividad" href="#" class="fab-add-activity" aria-label="Nueva actividad">
        <i class="fa-solid fa-plus" style="position: fixed;
        bottom: 24px;
        right: 20px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background-color: #B84A12;
        color: #FFFFFF;
        border: none;
        outline: none;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px rgba(184, 74, 18, 0.4);
        cursor: pointer;
        z-index: 1000;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        -webkit-tap-highlight-color: transparent; "></i>
    </a>

</div>

<script src="../js/guarderia/timeline.js"></script>
</body>
</html>
