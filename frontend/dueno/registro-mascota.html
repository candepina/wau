<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wau - Registrar Mascota</title>
    <link rel="stylesheet" href="../css/base.css" />

    <link rel="stylesheet" href="../css/dueno/registro-mascota.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

<div class="app-container">

    <!-- Top Bar con flecha de retorno -->
    <header class="top-bar-form">
        <a href="mis-mascotas.html" class="btn-back" aria-label="Volver">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="logo-small">
            <i class="fa-solid fa-paw"></i>
            <span>Wau</span>
        </div>
        <button class="icon-btn" aria-label="Notificaciones">
            <i class="fa-regular fa-bell"></i>
        </button>
    </header>

    <main class="main-content">
        <h1 class="form-title">REGISTRAR MASCOTA</h1>

        <!-- Selector de foto circular con botón + -->
        <div class="avatar-upload-container">
            <div class="avatar-circle">
                <i class="fa-solid fa-paw default-avatar-icon"></i>
                <button type="button" class="btn-avatar-plus" aria-label="Subir foto">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </div>

        <!-- Formulario de alta -->
        <form id="registroMascotaForm" class="pet-form">

            <!-- Datos básicos -->
            <div class="form-group">
                <label for="nombre">Nombre de la mascota *</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Milo" required />
            </div>

            <div class="form-group">
                <label for="raza">Raza</label>
                <input type="text" id="raza" name="raza" placeholder="Ej: Golden Retriever, Caniche, Mestizo" />
            </div>

            <!-- Fila doble equilibrada: Edad y Tamaño (50% cada uno con flex-1) -->
            <div class="form-row">
                <div class="form-group flex-1">
                    <label for="edad">Edad (años)</label>
                    <input type="number" id="edad" name="edad" min="0" max="30" placeholder="Ej: 3" />
                </div>

                <div class="form-group flex-1">
                    <label for="tamano">Tamaño</label>
                    <select id="tamano" name="tamano">
                        <option value="PEQUENO">Pequeño</option>
                        <option value="MEDIANO" selected>Mediano</option>
                        <option value="GRANDE">Grande</option>
                    </select>
                </div>
            </div>
            <!-- 2. Salud y nutrición -->
            <h3 class="section-title">Salud y nutrición</h3>
            <div class="form-group">
                <label for="alimentacion">Alimentación y horarios</label>
                <textarea id="alimentacion" rows="2" placeholder="Ej: 2 raciones al día (mañana y noche)..."></textarea>
            </div>

            <div class="form-group">
                <label for="alergias">Alergias</label>
                <textarea id="alergias" rows="2" placeholder="Ej: Alérgico al pollo o libreta sanitaria al día..."></textarea>
            </div>

            <!-- 3. Medicación -->
            <h3 class="section-title">Medicación</h3>
            <div class="form-group">
                <label for="medicacion">Medicación y horarios (si aplica)</label>
                <textarea id="medicacion" rows="2" placeholder="Ej: Gotas cada 12 hs, comprimidos..."></textarea>
            </div>

            <!-- 4. Cuidados especiales / Conducta -->
            <h3 class="section-title">Cuidados especiales</h3>
            <div class="form-group">
                <label for="conductuales">Observaciones (miedo a truenos, convivencia, etc.)</label>
                <textarea id="conductuales" rows="2" placeholder="Ej: Sociable con otros perros, miedo a tormentas..."></textarea>
            </div>

            <!-- Mensajes de feedback -->
            <div id="formFeedback" class="feedback-msg" style="display: none;"></div>

            <!-- Botón de acción principal -->
            <button type="submit" class="btn-submit-pet" id="btnSubmit">
                Registrar mascota
            </button>
        </form>
    </main>

</div>

<script src="../js/dueno/registro-mascota.js"></script>
</body>
</html>
