<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wau - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/auth/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<main class="login-wrapper">
    <section class="card">
        <header class="card-header">
            <h1 class="brand-title">Wau<span>.</span></h1>
            <p class="brand-subtitle">Bienvenido de vuelta, ingresá a tu cuenta</p>
        </header>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="ejemplo@correo.com"
                        required
                        autocomplete="email"
                />
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-field">
                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                    />
                    <button type="button" id="togglePassword" class="btn-toggle" aria-label="Mostrar contraseña">👁</button>
                </div>
            </div>

            <div id="feedbackMessage" class="feedback" aria-live="polite"></div>

            <button type="submit" id="submitBtn" class="btn-primary">
                <span class="btn-text">Iniciar Sesión</span>
                <span class="spinner" aria-hidden="true"></span>
            </button>

            <p style="margin-top: 1.25rem; text-align: center; font-size: 0.875rem; color: #64748b;">
                ¿No tenés cuenta? <a href="registro.html" style="color: #2563eb; text-decoration: none; font-weight: 600;">Registrate acá</a>
            </p>
        </form>
    </section>
</main>

<script src="js/auth/login.js"></script>
</body>
</html>
